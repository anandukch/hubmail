# Nginx configuration for hubmail
# Location: /etc/nginx/sites-available/hubmail.anandu.xyz

server {
    listen 80;
    server_name hubmail.anandu.xyz;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Logging
    access_log /var/log/nginx/hubmail-access.log;
    error_log /var/log/nginx/hubmail-error.log;

    client_max_body_size 10M;

    # Proxy settings
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # WebSocket / streaming (MCP Streamable HTTP transport needs this)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Proxy timeouts — MCP tool calls can run long, keep read timeout generous
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;

        proxy_cache_bypass $http_upgrade;

        # No buffering — required for MCP's streamed responses to flush promptly
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check (no auth required)
    location /health {
        proxy_pass http://localhost:3000/health;
        access_log off;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;
}

# SSL added by certbot — run:
#   sudo certbot --nginx -d hubmail.anandu.xyz
#
# After certbot, this file will also include:
# - listen 443 ssl
# - ssl_certificate / ssl_certificate_key paths
# - HTTP -> HTTPS redirect on the :80 server block
